# Realtime sync Worker — hosts the WebSocket relay Durable Object. Publicly
# routable (workers_dev = true) so browsers can connect directly via wss://.
# Deploy from the repo root:  pnpm run deploy:realtime
name = "realtime"
main = "index.ts"
compatibility_date = "2025-03-01"
workers_dev = true

[durable_objects]
bindings = [{ name = "SYNC", class_name = "SyncRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRoom"]

# Optional shared token. Uncomment and set the same value as PUBLIC_SYNC_TOKEN in
# the app's build env to gate the relay. (It's visible in client JS, so this is
# light abuse-prevention, not real auth.)
# [vars]
# SYNC_TOKEN = "your-shared-token"
